<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Canyon Squad Runner</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="phone">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div class="pill" id="squadPill">👥 <span id="squadCount">3</span></div>
      <div id="progressWrap"><div id="progressBar"></div><div id="bossMarker">👑</div></div>
      <div class="pill" id="coinPill">🪙 <span id="coinCount">0</span></div>
    </div>
    <div id="bossHudWrap" class="hidden">
      <div id="bossLabel">ESCORPIÓN DE ORO</div>
      <div id="bossHpWrap"><div id="bossHpBar"></div></div>
    </div>
    <div id="toast"></div>
  </div>

  <div id="screen-start" class="screen">
    <h1>CANYON<br/><span>SQUAD</span> RUNNER</h1>
    <p class="tagline">Multiplica tu escuadrón. Aplasta al enemigo. Vence al Escorpión.</p>
    <button id="btnStart" class="btn">TOCA PARA JUGAR</button>
    <div class="howto">
      <span>⬅️ ➡️ / A D / Desliza</span> para cambiar de carril<br/>
      Atraviesa puertas <b class="cyan">x2</b> para crecer · Evita escuadrones enemigos más grandes que el tuyo
    </div>
  </div>

  <div id="screen-gameover" class="screen hidden">
    <h1 class="red">ESCUADRÓN<br/>ANIQUILADO</h1>
    <p id="goStats" class="tagline"></p>
    <button id="btnRetry" class="btn">REINTENTAR</button>
  </div>

  <div id="screen-victory" class="screen hidden">
    <h1 class="gold">¡VICTORIA!</h1>
    <p id="vicStats" class="tagline"></p>
    <button id="btnAgain" class="btn gold-btn">JUGAR DE NUEVO</button>
  </div>
</div>

<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
